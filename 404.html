<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found · CyberKitchen</title>
  <meta name="theme-color" content="#3b82f6">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <script>
    /* Apply the saved theme immediately to avoid a flash (shared with the app: localStorage['ck.theme']) */
    (function () { var t; try { t = localStorage.getItem('ck.theme'); } catch (e) { } document.documentElement.setAttribute('data-theme', t || 'dark'); })();
  </script>
  <style>
    :root{
      --bg:#f6f8fb; --surf:#ffffff; --inset:#f1f5f9; --inset2:#e8edf3;
      --txt:#0f172a; --muted:#64748b; --acc:#3b82f6;
      --bdr:#e5eaf0; --cbdr:#c3cede; --shd:rgba(15,23,42,.06);
    }
    :root[data-theme="dark"]{
      --bg:#0d1117; --surf:#161b22; --inset:#1b212a; --inset2:#252c37;
      --txt:#e6edf3; --muted:#8b949e; --bdr:#2a313c; --cbdr:#3a424f; --shd:rgba(0,0,0,.35);
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      font-size:14px; background:var(--bg); color:var(--txt); line-height:1.5;
      min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
    }
    svg{display:block;}
    header{
      display:flex; align-items:center; gap:9px; padding:0 16px; height:44px;
      border-bottom:1px solid var(--bdr); background:var(--surf);
    }
    .brand{
      display:flex; align-items:center; gap:8px; font-size:19px; font-weight:800; letter-spacing:-.4px;
      text-decoration:none;
      background:linear-gradient(120deg,#3b82f6,#8b5cf6);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }
    .brand svg{stroke:#8b5cf6;}
    .spacer{flex:1;}
    .icon-btn{
      width:28px; height:28px; border-radius:7px; background:var(--inset); border:1px solid var(--bdr);
      display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; transition:.15s;
    }
    .icon-btn:hover{color:var(--acc); border-color:var(--acc);}
    main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px;}
    .err-wrap{text-align:center; max-width:420px; width:100%;}
    .err-code{
      font-size:118px; font-weight:800; line-height:1; letter-spacing:-6px; margin-bottom:6px;
      background:linear-gradient(130deg,#3b82f6 0%,#8b5cf6 60%,#ec4899 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 2px 24px rgba(139,92,246,.18));
    }
    .err-title{font-size:18px; font-weight:700; margin-bottom:8px;}
    .err-msg{font-size:14px; color:var(--muted); line-height:1.65; margin-bottom:22px;}
    .err-path{
      display:inline-flex; align-items:center; gap:6px; max-width:100%;
      background:var(--inset); border:1px solid var(--bdr); border-radius:6px; padding:5px 12px;
      font-family:'SF Mono','Consolas',monospace; font-size:12px; color:var(--muted); margin-bottom:26px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .err-path svg{stroke:var(--faint,#94a3b8); flex-shrink:0;}
    .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
    .btn-home,.btn-back{
      display:inline-flex; align-items:center; gap:7px; padding:9px 20px; border-radius:8px;
      font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; transition:.18s; border:1px solid transparent;
    }
    .btn-home{background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff;}
    .btn-home:hover{filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 4px 14px rgba(59,130,246,.35);}
    .btn-back{background:var(--inset); color:var(--txt); border-color:var(--bdr);}
    .btn-back:hover{background:var(--inset2);}
    footer{border-top:1px solid var(--bdr); background:var(--surf); padding:16px 24px;}
    .footer-inner{max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;}
    .footer-left{font-size:12.5px; font-weight:600; color:var(--muted);}
    .footer-gh{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; color:var(--muted); text-decoration:none; transition:color .15s;}
    .footer-gh:hover{color:var(--txt);}
    .footer-gh svg{stroke:currentColor;}
    @media (max-width:480px){
      .err-code{font-size:82px; letter-spacing:-3px;}
      .footer-inner{flex-direction:column; gap:6px; text-align:center;}
    }
  </style>
</head>
<body>

  <header>
    <a href="/CyberKitchen/" class="brand">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6M12 3v6M6 3v6a3 3 0 0 0 6 0M9 9v12M4 21h16M18 3c-1.5 0-3 2-3 5s1.5 4 3 4v9"/></svg>
      CyberKitchen
    </a>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><span id="themeIcon"></span></button>
  </header>

  <main>
    <div class="err-wrap">
      <div class="err-code">404</div>
      <div class="err-title">Page not found</div>
      <div class="err-msg">The tool or page you're looking for doesn't exist,<br>was moved, or the URL is incorrect.</div>
      <div class="err-path">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        <span id="errPath">/</span>
      </div>
      <div class="btn-row">
        <a href="/CyberKitchen/" class="btn-home">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-5h6v5"/></svg>
          Back to Home
        </a>
        <button class="btn-back" onclick="history.back()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Go Back
        </button>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-left">&copy; <span id="yr"></span> CyberKitchen · MIT License</span>
      <a href="https://github.com/bitwyser/CyberKitchen" target="_blank" rel="noopener" class="footer-gh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        GitHub
      </a>
    </div>
  </footer>

  <script>
    var SVG_MOON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    var SVG_SUN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    document.getElementById('errPath').textContent = window.location.pathname || '/';
    document.getElementById('yr').textContent = new Date().getFullYear();
    function paintTheme() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.getElementById('themeIcon').innerHTML = dark ? SVG_SUN : SVG_MOON;
    }
    document.getElementById('themeBtn').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('ck.theme', next); } catch (e) { }
      paintTheme();
    });
    paintTheme();
  </script>
</body>
</html>
